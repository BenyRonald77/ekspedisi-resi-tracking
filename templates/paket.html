{% extends "base.html" %}
{% block content %}
<h2>Paket</h2>
<table id="tbl"><thead><tr><th>Resi</th><th>Pengirim → Penerima</th><th>Berat</th><th>Zona</th><th>Ongkir</th><th>Status</th></tr></thead><tbody></tbody></table>
<h3>Paket Baru</h3>
<form id="f">
  <input name="nama_pengirim" placeholder="Nama pengirim" required>
  <input name="nama_penerima" placeholder="Nama penerima" required>
  <input name="alamat_tujuan" placeholder="Alamat tujuan" required>
  <input name="berat_kg" type="number" step="0.1" min="0.1" placeholder="Berat (kg)" required>
  <select name="zona_id" id="zona" required></select>
  <button>Buat Paket</button>
</form>
<div id="hasil"></div>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const z = await api("/api/zona");
  el("zona").innerHTML = z.map(x => `<option value="${x.id}">${x.nama} — ${rupiah(x.tarif_per_kg)}/kg (~${x.estimasi_hari} hari)</option>`).join("");
  const p = await api("/api/paket");
  el("tbl").querySelector("tbody").innerHTML = p.map(x =>
    `<tr><td><b>${x.no_resi}</b></td><td>${x.nama_pengirim} → ${x.nama_penerima}</td>
     <td>${x.berat_kg} kg</td><td>${x.nama_zona}</td><td>${rupiah(x.ongkir)}</td>
     <td><span class="badge">${x.status}</span></td></tr>`).join("");
}
el("f").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  d.berat_kg = +d.berat_kg; d.zona_id = +d.zona_id;
  const r = await post("/api/paket", d);
  if (r.error) return;
  el("hasil").innerHTML = `<div class="alert ok">Paket dibuat! Resi: <b>${r.no_resi}</b> · Ongkir: <b>${rupiah(r.ongkir)}</b></div>`;
  e.target.reset(); load();
};
load();
</script>
{% endblock %}
